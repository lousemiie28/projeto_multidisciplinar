<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLoop - Vitrine Ecológica</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        header { background-color: #2e7d32; color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .ods-badge { background-color: #f57c00; color: white; padding: 5px 10px; font-weight: bold; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .preco { font-size: 1.25rem; font-weight: bold; color: #2e7d32; margin: 10px 0; }
        .badge { background-color: #e0f2f1; color: #00796b; padding: 4px 8px; font-size: 0.85rem; border-radius: 12px; font-weight: bold; }
        button { background-color: #2e7d32; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; }
        button:hover { background-color: #1b5e20; }
    </style>
</head>
<body>

    <header>
        <h1>♻️ TechLoop Hardware</h1>
        <p>Eletrônicos Recondicionados com Garantia</p>
        <span class="ods-badge">Alinhado à ODS 12: Consumo Responsável</span>
    </header>

    <main class="catalogo" id="produtos-container">
        <!-- Os produtos da API entrarão aqui via JavaScript -->
    </main>

    <script>
        async function carregarProdutos() {
            try {
                const resposta = await fetch('http://localhost:3000/produtos');
                const produtos = await resposta.json();
                const container = document.getElementById('produtos-container');
                
                container.innerHTML = ''; 
                
                produtos.forEach(produto => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${produto.nome}</h3>
                        <span class="badge">Estado: ${produto.estado_conservacao}</span>
                        <p class="preco">R$ ${produto.preco.toFixed(2)}</p>
                        <button onclick="comprarItem(${produto.id})">Comprar e Reciclar</button>
                    `;
                    container.appendChild(card);
                });
            } catch (erro) {
                console.error("Erro ao conectar com a API:", erro);
                document.getElementById('produtos-container').innerHTML = '<p>Erro ao carregar o catálogo. Verifique o backend!</p>';
            }
        }

        function comprarItem(id) {
            alert(`Pedido simulado para o produto ID ${id}!\nConexão ODS 12: Você evitou o descarte de 200g de lixo eletrônico.`);
        }

        carregarProdutos();
    </script>
</body>
</html>
