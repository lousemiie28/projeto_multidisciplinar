<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLoop App - Técnico</title>
    <style>
        :root {
            --bg-main: #050505;        /* Preto Absoluto */
            --bg-phone: #09090d;       /* Fundo do Smartphone */
            --bg-card: #0e0e14;        /* Cartão Grafite Escuro */
            --text-main: #ffffff;      /* Branco Puro */
            --text-muted: #7c7c8a;     /* Cinza */
            --cyber-pink: #ff007f;     /* Rosa Neon */
            --cyber-pink-glow: rgba(255, 0, 127, 0.3);
            --border-color: #1a1a26;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            background: var(--bg-main); 
            min-height: 100vh;
        }

        /* Simulador Mockup de Smartphone */
        .phone-container { 
            width: 360px; 
            height: 680px; 
            background: var(--bg-phone); 
            border: 12px solid #14141a; 
            border-radius: 40px; 
            overflow-y: auto; 
            box-shadow: 0 25px 60px rgba(255, 0, 127, 0.08); 
            position: relative;
            color: var(--text-main);
        }

        .phone-container::-webkit-scrollbar {
            display: none;
        }

        header { 
            background-color: var(--bg-card); 
            padding: 24px 16px 16px 16px; 
            text-align: center; 
            font-weight: 800; 
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .sub-header { 
            background: rgba(255, 0, 127, 0.05); 
            color: var(--cyber-pink); 
            padding: 10px; 
            text-align: center; 
            font-size: 0.75rem; 
            font-weight: 700; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 0, 127, 0.1);
        }

        .card-pedido { 
            background: var(--bg-card); 
            margin: 16px; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .card-pedido::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--cyber-pink);
            border-radius: 12px 0 0 12px;
        }

        h3 { 
            margin: 0 0 16px 0; 
            font-size: 1.15rem; 
            color: var(--text-main); 
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .info-group {
            margin-bottom: 12px;
        }

        .info-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.03em;
        }

        .info-value {
            font-size: 0.95rem;
            color: #e2e8f0;
            margin: 4px 0 0 0;
            font-weight: 500;
        }

        .status { 
            display: inline-block; 
            background-color: rgba(255, 0, 127, 0.08); 
            color: var(--cyber-pink); 
            padding: 4px 12px; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(255, 0, 127, 0.2);
        }

        button { 
            background-color: transparent; 
            color: var(--cyber-pink); 
            border: 2px solid var(--cyber-pink); 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 20px; 
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        button:hover { 
            background-color: var(--cyber-pink); 
            color: #000000;
            box-shadow: 0 0 15px var(--cyber-pink-glow);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>📱 TechLoop Ops</header>
        <div class="sub-header">Ordens de Logística Reversa</div>
        
        <main id="pedidos-container">
            <div class="card-pedido">
                <h3>Coleta #1042</h3>
                
                <div class="info-group">
                    <p class="info-label">Doador / Cliente</p>
                    <p class="info-value">João Silva</p>
                </div>
                
                <div class="info-group">
                    <p class="info-label">Resíduo Tecnológico</p>
                    <p class="info-value">Notebook Antigo (E-waste)</p>
                </div>
                
                <div class="info-group">
                    <p class="info-label">Endereço de Coleta</p>
                    <p class="info-value">Av. Paulista, 1000 - Apto 42</p>
                </div>

                <span class="status">Aguardando Retirada</span>
                <button onclick="atualizarStatus(this)">Confirmar Coleta (ODS 12)</button>
            </div>
        </main>
    </div>

    <script>
        function atualizarStatus(botao) {
            const card = botao.parentElement;
            const statusSpan = card.querySelector('.status');
            
            statusSpan.textContent = 'Coletado & Destinado';
            statusSpan.style.backgroundColor = 'rgba(52, 211, 153, 0.1)';
            statusSpan.style.color = '#34d399';
            statusSpan.style.borderColor = 'rgba(52, 211, 153, 0.2)';
            
            botao.style.display = 'none';
            
            alert('Sucesso!\n\nDispositivo recolhido. O volume de hardware foi removido do fluxo de descarte inadequado e registrado nas métricas da ODS 12.');
        }
    </script>
</body>
</html>
